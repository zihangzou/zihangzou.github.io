name: Update usage statistics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
concurrency:
  group: usage-statistics
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'zihangzou/zihangzou.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check analytics configuration
        id: config
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_API_TOKEN" ] && [ -n "$CF_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Waiting for CF_API_TOKEN and CF_ACCOUNT_ID repository secrets. No data was generated."
          fi
      - name: Check out the website
        if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - name: Read aggregate Cloudflare analytics
        if: steps.config.outputs.ready == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: python3 scripts/update_usage.py
      - name: Publish the statistics snapshot
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- usage-data.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- usage-data.json
          git commit -m "Update aggregate website usage"
          git push origin HEAD:main
          # Token-authored commits do not automatically trigger a legacy Pages build.
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
